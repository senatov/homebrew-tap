name: Update Cask

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v5

      - name: Update from latest MiMiNavigator release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          release_json="$(gh api repos/senatov/MiMiNavigator/releases/latest)"
          tag="$(jq -r '.tag_name' <<< "${release_json}")"
          version="${tag#v}"
          asset_name="MiMiNavigator-${version}.dmg"
          asset_api_url="$(jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .url' <<< "${release_json}")"
          if [[ -z "${asset_api_url}" || "${asset_api_url}" == "null" ]]; then
            print -u2 "Release ${tag} does not contain ${asset_name}"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "${asset_api_url}" > "${RUNNER_TEMP}/${asset_name}"
          sha256="$(shasum -a 256 "${RUNNER_TEMP}/${asset_name}" | awk '{print $1}')"
          export VERSION="${version}"
          export SHA256="${sha256}"
          ruby -e '
            path = "Casks/miminavigator.rb"
            contents = File.read(path)
            contents.sub!(/version "[^"]+"/, "version \"#{ENV.fetch("VERSION")}\"")
            contents.sub!(/sha256 "[0-9a-f]+"/, "sha256 \"#{ENV.fetch("SHA256")}\"")
            File.write(path, contents)
          '

      - name: Validate Cask
        shell: zsh {0}
        run: |
          set -euo pipefail
          brew style Casks/miminavigator.rb
          brew tap senatov/tap
          cp Casks/miminavigator.rb "$(brew --repository senatov/tap)/Casks/miminavigator.rb"
          brew audit --cask --strict senatov/tap/miminavigator

      - name: Publish update
        shell: zsh {0}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/miminavigator.rb; then
            echo "Cask is already current."
            exit 0
          fi
          version="$(ruby -ne 'puts $1 if $_ =~ /^\s*version "([^"]+)"/' Casks/miminavigator.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/miminavigator.rb
          git commit -m "update miminavigator ${version}"
          git push
